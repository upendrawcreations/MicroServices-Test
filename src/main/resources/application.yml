server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: test-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

app:
  jwt:
    secret: "${JWT_SECRET:change-this-secret-to-a-long-random-string}"


eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER_URL:http://localhost:8761/eureka}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

test-service:
  message-prefix: "${TEST_SERVICE_MESSAGE_PREFIX:Hello }"
